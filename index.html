<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stack Attack - Extended Soundtrack</title>
    <style>
        :root {
            --clr-bg: #010a02;
            --clr-on: #00ff41;
            --clr-dim: #005511;
            --clr-bright: #ccffcc;
            --clr-shadow: rgba(0, 255, 65, 0.25);
            --clr-glow: rgba(0, 255, 65, 0.8);
            --btn-bg: #112211;
            --btn-active-bg: #1a331a;
        }

        body.theme-amber {
            --clr-bg: #0d0800;
            --clr-on: #ffb000;
            --clr-dim: #553b00;
            --clr-bright: #ffea9f;
            --clr-shadow: rgba(255, 176, 0, 0.25);
            --clr-glow: rgba(255, 176, 0, 0.8);
            --btn-bg: #221a00;
            --btn-active-bg: #332600;
        }

        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 6px;
            color: var(--clr-on);
            font-family: 'Courier New', Courier, monospace;
            flex-direction: column;
            overflow-x: hidden;
            transition: color 0.3s ease;
        }

        #vcr-body {
            background-color: #1a1a1a;
            padding: 12px;
            border-radius: 12px;
            box-shadow: inset 0 0 15px #000, 0 10px 30px rgba(0,0,0,0.7);
            border: 2px solid #333;
            position: relative;
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .top-btn {
            background-color: #111;
            border: 1px solid var(--clr-on);
            color: var(--clr-on);
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 2px 0 #000;
        }

        .top-btn:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        #display-window {
            background-color: #000;
            padding: 4px;
            border-radius: 6px;
            border: 3px solid #444;
            position: relative;
            box-shadow: 0 0 20px var(--clr-shadow);
            overflow: hidden;
            width: 100%;
        }

        canvas {
            display: block;
            background-color: var(--clr-bg);
            filter: blur(0.3px) drop-shadow(0 0 4px var(--clr-glow));
            cursor: pointer;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
        }

        #display-window::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.3) 50%
            );
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        #status-bar {
            margin-top: 8px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            color: var(--clr-on);
            text-shadow: 0 0 5px var(--clr-shadow);
        }

        .led-active {
            color: #ff3333;
            text-shadow: 0 0 6px #ff0000;
        }

        #touch-controls {
            display: none;
            width: 100%;
            margin-top: 10px;
            gap: 6px;
            justify-content: space-between;
            flex-wrap: nowrap;
        }

        .touch-group {
            display: flex;
            gap: 6px;
            flex: 1;
        }

        .touch-group-right {
            justify-content: flex-end;
        }

        .touch-btn {
            background-color: var(--btn-bg);
            border: 1.5px solid var(--clr-on);
            color: var(--clr-on);
            border-radius: 6px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 0;
            flex: 1;
            min-width: 0;
            touch-action: manipulation;
            box-shadow: 0 3px 0 var(--clr-dim);
            text-shadow: 0 0 4px var(--clr-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .touch-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 transparent;
            background-color: var(--clr-on);
            color: #000;
        }

        .touch-btn-action {
            border-color: var(--clr-bright);
            background-color: var(--btn-active-bg);
            flex: 1.4;
        }

        @media (hover: none) and (pointer: coarse) {
            #touch-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div id="vcr-body">
        <div id="top-bar">
            <button class="top-btn" id="audio-toggle">🔇 SOUND: OFF</button>
            <button class="top-btn" id="theme-toggle">🎨 COLOR</button>
        </div>

        <div id="display-window">
            <canvas id="gameCanvas" width="700" height="700"></canvas>
        </div>
        
        <div id="status-bar">
            <div><span id="play-led">●</span> <span id="status-text">READY</span></div>
            <div>LIVES: <span id="lives-val">♥♥♥</span></div>
            <div>SCORE: <span id="score-val">0000</span></div>
            <div>LEVEL: <span id="level-val">01</span></div>
        </div>

        <div id="touch-controls">
            <div class="touch-group">
                <button class="touch-btn" id="btn-left">◄</button>
                <button class="touch-btn" id="btn-right">►</button>
            </div>
            <div class="touch-group touch-group-right">
                <button class="touch-btn" id="btn-pause">⏸</button>
                <button class="touch-btn touch-btn-action" id="btn-jump">JUMP</button>
            </div>
        </div>
    </div>

<script>
class SoundSystem {
    constructor() {
        this.ctx = null;
        this.muted = true;
        this.musicTimer = null;
        this.noteIndex = 0;
        this.currentMelodyIndex = 0;

        const C4=261.63, D4=293.66, E4=329.63, F4=349.23, G4=392.00, A4=440.00, B4=493.88;
        const C5=523.25, D5=587.33, E5=659.25, F5=698.46, G5=783.99, A5=880.00, B5=987.77, C6=1046.50;
        const C3=130.81, E3=164.81, G3=196.00, A3=220.00, B3=246.94, F3=174.61;

        this.melody1 = [
            { f: C4, d: 0.25 }, { f: E4, d: 0.25 }, { f: G4, d: 0.25 }, { f: C5, d: 0.25 },
            { f: B4, d: 0.25 }, { f: G4, d: 0.25 }, { f: E4, d: 0.25 }, { f: D4, d: 0.25 },
            { f: C4, d: 0.25 }, { f: E4, d: 0.25 }, { f: G4, d: 0.25 }, { f: C5, d: 0.25 },
            { f: D5, d: 0.50 }, { f: B4, d: 0.50 },

            { f: A3, d: 0.25 }, { f: C4, d: 0.25 }, { f: E4, d: 0.25 }, { f: A4, d: 0.25 },
            { f: G4, d: 0.25 }, { f: E4, d: 0.25 }, { f: C4, d: 0.25 }, { f: B3, d: 0.25 },
            { f: A3, d: 0.25 }, { f: C4, d: 0.25 }, { f: E4, d: 0.25 }, { f: A4, d: 0.25 },
            { f: B4, d: 0.50 }, { f: G4, d: 0.50 },

            { f: C5, d: 0.375 }, { f: D5, d: 0.125 }, { f: E5, d: 0.25 }, { f: C5, d: 0.25 },
            { f: A4, d: 0.25 }, { f: F4, d: 0.25 }, { f: G4, d: 0.50 },
            { f: C5, d: 0.375 }, { f: D5, d: 0.125 }, { f: E5, d: 0.25 }, { f: G5, d: 0.25 },
            { f: F5, d: 0.50 }, { f: D5, d: 0.50 },

            { f: E5, d: 0.25 }, { f: D5, d: 0.25 }, { f: C5, d: 0.25 }, { f: B4, d: 0.25 },
            { f: A4, d: 0.25 }, { f: G4, d: 0.25 }, { f: F4, d: 0.25 }, { f: E4, d: 0.25 },
            { f: D4, d: 0.25 }, { f: F4, d: 0.25 }, { f: A4, d: 0.25 }, { f: B4, d: 0.25 },
            { f: C5, d: 0.75 }, { f: 0,  d: 0.25 },

            { f: E5, d: 0.125 }, { f: E5, d: 0.125 }, { f: 0, d: 0.125 }, { f: E5, d: 0.125 },
            { f: 0,  d: 0.125 }, { f: C5, d: 0.125 }, { f: E5, d: 0.25 },
            { f: G5, d: 0.50 },  { f: G4, d: 0.50 },

            { f: C5, d: 0.375 }, { f: G4, d: 0.125 }, { f: 0, d: 0.25 }, { f: E4, d: 0.25 },
            { f: A4, d: 0.25 },  { f: B4, d: 0.25 },  { f: A4, d: 0.25 }, { f: G4, d: 0.25 },

            { f: E5, d: 0.125 }, { f: E5, d: 0.125 }, { f: 0, d: 0.125 }, { f: E5, d: 0.125 },
            { f: 0,  d: 0.125 }, { f: C5, d: 0.125 }, { f: E5, d: 0.25 },
            { f: G5, d: 0.50 },  { f: G4, d: 0.50 },

            { f: F5, d: 0.25 }, { f: F5, d: 0.25 }, { f: F5, d: 0.25 }, { f: A5, d: 0.25 },
            { f: G5, d: 0.25 }, { f: E5, d: 0.25 }, { f: C5, d: 0.25 }, { f: D5, d: 0.25 },

            { f: C5, d: 0.25 }, { f: G4, d: 0.25 }, { f: A4, d: 0.25 }, { f: E4, d: 0.25 },
            { f: F4, d: 0.25 }, { f: C4, d: 0.25 }, { f: D4, d: 0.25 }, { f: G3, d: 0.25 },
            { f: C4, d: 0.25 }, { f: E4, d: 0.25 }, { f: G4, d: 0.25 }, { f: B4, d: 0.25 },
            { f: C5, d: 0.50 }, { f: G4, d: 0.50 },

            { f: A4, d: 0.375 }, { f: B4, d: 0.125 }, { f: C5, d: 0.25 }, { f: A4, d: 0.25 },
            { f: F5, d: 0.50 },  { f: D5, d: 0.50 },
            { f: E5, d: 0.375 }, { f: C5, d: 0.125 }, { f: G4, d: 0.25 }, { f: E4, d: 0.25 },
            { f: D4, d: 0.50 },  { f: G4, d: 0.50 },

            { f: C5, d: 0.25 }, { f: B4, d: 0.25 }, { f: A4, d: 0.25 }, { f: G4, d: 0.25 },
            { f: F4, d: 0.25 }, { f: E4, d: 0.25 }, { f: D4, d: 0.25 }, { f: C4, d: 0.25 },
            { f: B3, d: 0.25 }, { f: D4, d: 0.25 }, { f: G4, d: 0.25 }, { f: B4, d: 0.25 },
            { f: C5, d: 0.50 }, { f: G5, d: 0.50 },
            { f: C6, d: 1.00 }, { f: 0,  d: 1.00 }
        ];

        this.melody2 = [
            { f: C4, d: 0.125 }, { f: E4, d: 0.125 }, { f: G4, d: 0.125 }, { f: C5, d: 0.125 },
            { f: E5, d: 0.125 }, { f: C5, d: 0.125 }, { f: G4, d: 0.125 }, { f: E4, d: 0.125 },
            { f: A3, d: 0.125 }, { f: C4, d: 0.125 }, { f: E4, d: 0.125 }, { f: A4, d: 0.125 },
            { f: C5, d: 0.125 }, { f: A4, d: 0.125 }, { f: E4, d: 0.125 }, { f: C4, d: 0.125 },
            { f: F3, d: 0.125 }, { f: A3, d: 0.125 }, { f: C4, d: 0.125 }, { f: F4, d: 0.125 },
            { f: A4, d: 0.125 }, { f: F4, d: 0.125 }, { f: C4, d: 0.125 }, { f: A3, d: 0.125 },
            { f: G3, d: 0.125 }, { f: B3, d: 0.125 }, { f: D4, d: 0.125 }, { f: G4, d: 0.125 },
            { f: B4, d: 0.25  }, { f: G4, d: 0.25  }, { f: 0,  d: 0.25  }
        ];
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    toggleMute() {
        this.init();
        this.muted = !this.muted;
        if (this.muted) {
            this.stopMusic();
        } else {
            this.startMusic();
        }
        return !this.muted;
    }

    playTone(freq, duration, type = 'square', startGain = 0.08) {
        if (this.muted || !this.ctx || freq === 0) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(startGain, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
    }

    jump() {
        if (this.muted || !this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
        } catch(e) {}
    }

    push() { this.playTone(80, 0.08, 'sawtooth', 0.12); }
    hit() { this.playTone(120, 0.25, 'sawtooth', 0.25); }

    clearLine() {
        if (this.muted || !this.ctx) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            setTimeout(() => this.playTone(freq, 0.1, 'square', 0.12), i * 60);
        });
    }

    explosion() {
        if (this.muted || !this.ctx) return;
        try {
            const bufferSize = this.ctx.sampleRate * 0.3;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            noise.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start();
        } catch(e) {}
    }

    lifeUp() {
        [440, 554, 659, 880].forEach((freq, i) => {
            setTimeout(() => this.playTone(freq, 0.08, 'triangle', 0.15), i * 50);
        });
    }

    startMusic() {
        if (this.muted || this.musicTimer) return;
        this.playNextNote();
    }

    playNextNote() {
        if (this.muted || gameOver || isPaused || gameStarted === false) {
            this.musicTimer = null;
            return;
        }

        const currentMelody = this.currentMelodyIndex === 0 ? this.melody1 : this.melody2;
        const note = currentMelody[this.noteIndex];
        
        if (note.f > 0) {
            this.playTone(note.f, note.d, 'triangle', 0.05);
        }
        
        this.noteIndex++;
        if (this.noteIndex >= currentMelody.length) {
            this.noteIndex = 0;
            this.currentMelodyIndex = (this.currentMelodyIndex + 1) % 2; 
        }
        
        this.musicTimer = setTimeout(() => this.playNextNote(), note.d * 1000);
    }

    stopMusic() {
        if (this.musicTimer) {
            clearTimeout(this.musicTimer);
            this.musicTimer = null;
        }
    }
}

const sound = new SoundSystem();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score-val');
const levelEl = document.getElementById('level-val');
const livesEl = document.getElementById('lives-val');
const statusTextEl = document.getElementById('status-text');
const playLedEl = document.getElementById('play-led');
const themeToggleBtn = document.getElementById('theme-toggle');
const audioToggleBtn = document.getElementById('audio-toggle');

ctx.imageSmoothingEnabled = false;

let gameStarted = false;
let selectedDifficulty = null; // 'EASY', 'MEDIUM', 'HARD'
let speedMultiplierRate = 0.10; // 10%, 15%, 20%
const INITIAL_SPAWN_INTERVAL = 70;
const MIN_SPAWN_INTERVAL = INITIAL_SPAWN_INTERVAL * (1 - 0.80); // Максимум +80% к скорости (интервал 20% от начального)

audioToggleBtn.addEventListener('click', () => {
    const active = sound.toggleMute();
    audioToggleBtn.innerText = active ? "🔊 SOUND: ON" : "🔇 SOUND: OFF";
});

let currentTheme = 'green';
themeToggleBtn.addEventListener('click', () => {
    if (currentTheme === 'green') {
        document.body.classList.add('theme-amber');
        currentTheme = 'amber';
    } else {
        document.body.classList.remove('theme-amber');
        currentTheme = 'green';
    }
});

function getThemeColors() {
    const style = getComputedStyle(document.body);
    return {
        bg: style.getPropertyValue('--clr-bg').trim(),
        on: style.getPropertyValue('--clr-on').trim(),
        dim: style.getPropertyValue('--clr-dim').trim(),
        bright: style.getPropertyValue('--clr-bright').trim(),
        red: '#ff3333'
    };
}

const COLS = 14;
const ROWS = 14;
const BLOCK_SIZE = 50;

let score = 0;
let level = 1;
let lives = 3;
let gameOver = false;
let isPaused = false;

// Кнопки выбора сложности на стартовом экране
const easyBtn = { x: 200, y: 320, w: 300, h: 45, mode: 'EASY', rate: 0.10 };
const medBtn  = { x: 200, y: 380, w: 300, h: 45, mode: 'MEDIUM', rate: 0.15 };
const hardBtn = { x: 200, y: 440, w: 300, h: 45, mode: 'HARD', rate: 0.20 };

const restartBtn = { x: 250, y: 380, w: 200, h: 50 };

let grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
let burnEffects = []; 

const player = {
    xPixel: 6 * BLOCK_SIZE,
    yPixel: (ROWS - 1) * BLOCK_SIZE,
    speedX: 6,
    isJumping: false,
    jumpProgress: 0,
    jumpStartPixelY: 0,
    targetJumpHeight: BLOCK_SIZE * 1.2,
    facing: 1,
    alive: true,
    invincibleTimer: 0,
    walkFrame: 0,
    isMoving: false
};

let fallingCrates = [];
let spawnCooldown = 0;
let baseSpawnInterval = INITIAL_SPAWN_INTERVAL;

const crane = {
    xPixel: -100,
    targetX: 0,
    targetCol: 0,
    secondTargetCol: -1,
    state: 'idle',
    crateType: 1,
    secondCrateType: 1,
    baseSpeed: 10,
    fixedDropSpeed: 3.5
};

function updateLivesDisplay() {
    livesEl.innerText = "♥".repeat(Math.max(0, lives));
}

function startGame(difficulty, rate) {
    sound.init();
    selectedDifficulty = difficulty;
    speedMultiplierRate = rate;
    gameStarted = true;
    resetGame();
}

function resetGame() {
    score = 0;
    level = 1;
    lives = 3;
    gameOver = false;
    isPaused = false;
    
    spawnCooldown = 0;
    baseSpawnInterval = INITIAL_SPAWN_INTERVAL;
    crane.baseSpeed = 10;
    crane.fixedDropSpeed = 3.5;
    
    grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
    burnEffects = [];
    fallingCrates = [];
    crane.state = 'idle';
    crane.xPixel = -100;

    player.xPixel = 6 * BLOCK_SIZE;
    player.yPixel = (ROWS - 1) * BLOCK_SIZE;
    player.isJumping = false;
    player.alive = true;
    player.invincibleTimer = 0;
    player.walkFrame = 0;
    player.isMoving = false;

    scoreEl.innerText = "0000";
    levelEl.innerText = "01";
    statusTextEl.innerText = "PLAY";
    playLedEl.classList.add('led-active');
    updateLivesDisplay();

    sound.noteIndex = 0;
    sound.currentMelodyIndex = 0;
    sound.startMusic();
}

function getRandomCrateType() {
    const rand = Math.random();
    if (rand < 0.05) return 5;        // TNT
    else if (rand < 0.06) return 4;   // Life
    else if (rand < 0.50) return 1;   // Wood
    else if (rand < 0.80) return 2;   // Steel
    else return 3;                    // Glass
}

function triggerCraneSpawn() {
    if (crane.state !== 'idle') return;

    const col1 = Math.floor(Math.random() * COLS);
    
    if (grid[0][col1] !== null) {
        gameOver = true;
        statusTextEl.innerText = "OVER";
        playLedEl.classList.remove('led-active');
        sound.hit();
        sound.stopMusic();
        return;
    }

    crane.targetCol = col1;
    crane.targetX = col1 * BLOCK_SIZE;
    crane.crateType = getRandomCrateType();

    const isDualDrop = Math.random() < 0.10;
    if (isDualDrop) {
        let col2 = Math.floor(Math.random() * COLS);
        let attempts = 0;
        while (col2 === col1 && attempts < 10) {
            col2 = Math.floor(Math.random() * COLS);
            attempts++;
        }
        if (col2 !== col1 && grid[0][col2] === null) {
            crane.secondTargetCol = col2;
            crane.secondCrateType = getRandomCrateType();
            crane.targetCol = Math.max(col1, col2);
            crane.targetX = crane.targetCol * BLOCK_SIZE;
        } else {
            crane.secondTargetCol = -1;
        }
    } else {
        crane.secondTargetCol = -1;
    }

    crane.state = 'moving_in';
}

const keys = {};

function togglePause() {
    if (!gameOver && gameStarted) {
        isPaused = !isPaused;
        if (isPaused) {
            statusTextEl.innerText = "PAUSE";
            playLedEl.classList.remove('led-active');
            sound.stopMusic();
        } else {
            statusTextEl.innerText = "PLAY";
            playLedEl.classList.add('led-active');
            sound.startMusic();
        }
    }
}

document.addEventListener('keydown', (e) => {
    sound.init(); 
    if (!gameStarted) {
        if (e.code === 'Digit1' || e.code === 'Numpad1') startGame('EASY', 0.10);
        if (e.code === 'Digit2' || e.code === 'Numpad2') startGame('MEDIUM', 0.15);
        if (e.code === 'Digit3' || e.code === 'Numpad3') startGame('HARD', 0.20);
        return;
    }
    if (gameOver && (e.code === 'Space' || e.code === 'Enter')) {
        resetGame();
        return;
    }
    if (e.code === 'KeyP' || e.code === 'Escape') {
        togglePause();
        return;
    }
    if (gameOver || !player.alive || isPaused) return;
    keys[e.code] = true;
    if ((e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') && !player.isJumping) {
        startJump();
    }
});

document.addEventListener('keyup', (e) => keys[e.code] = false);

function bindTouchButton(btnId, keyCode) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        sound.init();
        if (!gameStarted) { return; }
        if (gameOver) { resetGame(); return; }
        if (keyCode === 'KeyP') { togglePause(); return; }
        if (keyCode === 'Space' && !player.isJumping && !isPaused && player.alive) { startJump(); }
        keys[keyCode] = true;
    });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyCode] = false; });
}

bindTouchButton('btn-left', 'ArrowLeft');
bindTouchButton('btn-right', 'ArrowRight');
bindTouchButton('btn-jump', 'Space');
bindTouchButton('btn-pause', 'KeyP');

canvas.addEventListener('click', (e) => {
    sound.init();
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mouseX = (e.clientX - rect.left) * scaleX;
    const mouseY = (e.clientY - rect.top) * scaleY;

    if (!gameStarted) {
        if (mouseX >= easyBtn.x && mouseX <= easyBtn.x + easyBtn.w &&
            mouseY >= easyBtn.y && mouseY <= easyBtn.y + easyBtn.h) {
            startGame(easyBtn.mode, easyBtn.rate);
        } else if (mouseX >= medBtn.x && mouseX <= medBtn.x + medBtn.w &&
            mouseY >= medBtn.y && mouseY <= medBtn.y + medBtn.h) {
            startGame(medBtn.mode, medBtn.rate);
        } else if (mouseX >= hardBtn.x && mouseX <= hardBtn.x + hardBtn.w &&
            mouseY >= hardBtn.y && mouseY <= hardBtn.y + hardBtn.h) {
            startGame(hardBtn.mode, hardBtn.rate);
        }
        return;
    }

    if (gameOver) {
        if (mouseX >= restartBtn.x && mouseX <= restartBtn.x + restartBtn.w &&
            mouseY >= restartBtn.y && mouseY <= restartBtn.y + restartBtn.h) {
            resetGame();
        }
    }
});

function startJump() {
    player.isJumping = true;
    player.jumpProgress = 0;
    player.jumpStartPixelY = player.yPixel;
    sound.jump();
}

function applyPhysicsToGrid() {
    let changed = false;
    for (let r = ROWS - 2; r >= 0; r--) {
        for (let c = 0; c < COLS; c++) {
            if (grid[r][c] !== null && grid[r + 1][c] === null) {
                grid[r + 1][c] = grid[r][c];
                grid[r][c] = null;
                changed = true;
            }
        }
    }
    if (changed) setTimeout(applyPhysicsToGrid, 50);
}

function triggerTNTExplosion(centerR, centerC) {
    sound.explosion();
    for (let r = Math.max(0, centerR - 1); r <= Math.min(ROWS - 1, centerR + 1); r++) {
        for (let c = Math.max(0, centerC - 1); c <= Math.min(COLS - 1, centerC + 1); c++) {
            grid[r][c] = null;
        }
    }
    applyPhysicsToGrid();
}

function checkLines() {
    for (let r = ROWS - 1; r >= 0; r--) {
        let isFull = true;
        for (let c = 0; c < COLS; c++) {
            if (grid[r][c] === null) {
                isFull = false;
                break;
            }
        }

        if (isFull) {
            burnEffects.push({ row: r, timer: 10 });
            sound.clearLine();

            setTimeout(() => {
                let hasTNT = false;
                let tntC = 0;

                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c]) {
                        if (grid[r][c].type === 4 && lives < 5) {
                            lives++;
                            updateLivesDisplay();
                            sound.lifeUp();
                        }
                        if (grid[r][c].type === 5) {
                            hasTNT = true;
                            tntC = c;
                        }
                    }
                    grid[r][c] = null;
                }

                if (hasTNT) {
                    triggerTNTExplosion(r, tntC);
                }

                score += 150;
                level++;
                
                // Ускорение спавна в зависимости от уровня сложности, с ограничением в +80%
                baseSpawnInterval = Math.max(MIN_SPAWN_INTERVAL, baseSpawnInterval * (1 - speedMultiplierRate));
                crane.baseSpeed = Math.min(18, crane.baseSpeed * (1 + speedMultiplierRate * 0.5));
                crane.fixedDropSpeed = Math.min(6.3, crane.fixedDropSpeed * (1 + speedMultiplierRate * 0.5));

                scoreEl.innerText = score.toString().padStart(4, '0');
                levelEl.innerText = level.toString().padStart(2, '0');

                applyPhysicsToGrid();
            }, 300);
        }
    }
}

function isColliding(rect1, rect2) {
    return rect1.x < rect2.x + rect2.w &&
           rect1.x + rect1.w > rect2.x &&
           rect1.y < rect2.y + rect2.h &&
           rect1.y + rect1.h > rect2.y;
}

function update() {
    if (!gameStarted || gameOver || isPaused) return;

    if (player.invincibleTimer > 0) player.invincibleTimer--;

    const currentGridRow = Math.round(player.yPixel / BLOCK_SIZE);
    let moveDir = 0;

    if (keys['KeyA'] || keys['ArrowLeft']) {
        player.facing = -1;
        moveDir = -1;
    } else if (keys['KeyD'] || keys['ArrowRight']) {
        player.facing = 1;
        moveDir = 1;
    }

    if (moveDir !== 0 && !player.isJumping) {
        player.isMoving = true;
        player.walkFrame += 0.3;
    } else {
        player.isMoving = false;
        player.walkFrame = 0;
    }

    if (crane.state === 'idle') {
        spawnCooldown--;
        if (spawnCooldown <= 0) {
            triggerCraneSpawn();
        }
    }

    if (crane.state === 'moving_in') {
        crane.xPixel += crane.baseSpeed;
        if (crane.xPixel >= crane.targetX) {
            crane.xPixel = crane.targetX;
            crane.state = 'dropping';
            
            fallingCrates.push({
                col: crane.targetCol,
                targetCol: crane.targetCol,
                xPixel: crane.targetCol * BLOCK_SIZE,
                yPixel: 40,
                type: crane.crateType,
                speed: crane.fixedDropSpeed
            });

            if (crane.secondTargetCol !== -1) {
                fallingCrates.push({
                    col: crane.secondTargetCol,
                    targetCol: crane.secondTargetCol,
                    xPixel: crane.secondTargetCol * BLOCK_SIZE,
                    yPixel: 40,
                    type: crane.secondCrateType,
                    speed: crane.fixedDropSpeed
                });
            }

            crane.state = 'moving_out';
        }
    } else if (crane.state === 'moving_out') {
        crane.xPixel -= crane.baseSpeed;
        if (crane.xPixel <= -100) {
            crane.state = 'idle';
            spawnCooldown = baseSpawnInterval;
        }
    }

    if (moveDir !== 0) {
        fallingCrates.forEach(crate => {
            const crateRect = { x: crate.xPixel, y: crate.yPixel, w: BLOCK_SIZE, h: BLOCK_SIZE };
            const playerReachRect = {
                x: player.xPixel + (moveDir === 1 ? 5 : -15),
                y: player.yPixel - 12,
                w: BLOCK_SIZE + 10,
                h: BLOCK_SIZE + 12
            };

            if (isColliding(crateRect, playerReachRect)) {
                const nextTargetCol = crate.col + moveDir;
                if (nextTargetCol >= 0 && nextTargetCol < COLS && Math.abs(nextTargetCol - crate.col) <= 1) {
                    const crateRow = Math.floor((crate.yPixel + BLOCK_SIZE / 2) / BLOCK_SIZE);
                    if (grid[crateRow] && grid[crateRow][nextTargetCol] === null) {
                        crate.targetCol = nextTargetCol; 
                        sound.push();
                    }
                }
            }
        });
    }

    fallingCrates.forEach(crate => {
        const targetX = crate.targetCol * BLOCK_SIZE;
        crate.xPixel += (targetX - crate.xPixel) * 0.2;
        crate.col = Math.round(crate.xPixel / BLOCK_SIZE);
    });

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const block = grid[r][c];
            if (block) {
                const targetX = c * BLOCK_SIZE;
                const targetY = r * BLOCK_SIZE;
                block.xPixel += (targetX - block.xPixel) * 0.25;
                block.yPixel += (targetY - block.yPixel) * 0.25;
            }
        }
    }

    if (moveDir === -1) {
        const targetX = player.xPixel - player.speedX;
        const targetCol = Math.floor((targetX + 5) / BLOCK_SIZE);

        if (targetCol >= 0) {
            const blockLeft = grid[currentGridRow] ? grid[currentGridRow][targetCol] : null;
            if (blockLeft === null) {
                player.xPixel = Math.max(0, targetX);
            } else {
                const pushToCol = targetCol - 1;
                if (pushToCol >= 0 && grid[currentGridRow][pushToCol] === null) {
                    grid[currentGridRow][pushToCol] = blockLeft;
                    grid[currentGridRow][targetCol] = null;
                    player.xPixel = Math.max(0, targetX);
                    sound.push();
                    applyPhysicsToGrid();
                }
            }
        }
    } else if (moveDir === 1) {
        const targetX = player.xPixel + player.speedX;
        const targetCol = Math.floor((targetX + BLOCK_SIZE - 5) / BLOCK_SIZE);

        if (targetCol < COLS) {
            const blockRight = grid[currentGridRow] ? grid[currentGridRow][targetCol] : null;
            if (blockRight === null) {
                player.xPixel = Math.min((COLS - 1) * BLOCK_SIZE, targetX);
            } else {
                const pushToCol = targetCol + 1;
                if (pushToCol < COLS && grid[currentGridRow][pushToCol] === null) {
                    grid[currentGridRow][pushToCol] = blockRight;
                    grid[currentGridRow][targetCol] = null;
                    player.xPixel = Math.min((COLS - 1) * BLOCK_SIZE, targetX);
                    sound.push();
                    applyPhysicsToGrid();
                }
            }
        }
    }

    if (player.isJumping) {
        player.jumpProgress += 0.08;

        if (player.jumpProgress >= 1) {
            player.isJumping = false;
            player.jumpProgress = 0;
        } else {
            const jumpOffset = Math.sin(player.jumpProgress * Math.PI) * player.targetJumpHeight;
            player.yPixel = player.jumpStartPixelY - jumpOffset;

            const checkCol = Math.round(player.xPixel / BLOCK_SIZE);
            const targetRowBelow = Math.floor((player.yPixel + BLOCK_SIZE - 5) / BLOCK_SIZE);
            
            if (targetRowBelow < ROWS && grid[targetRowBelow] && grid[targetRowBelow][checkCol] !== null) {
                player.yPixel = (targetRowBelow - 1) * BLOCK_SIZE;
                player.isJumping = false;
            }
        }
    } else {
        const checkCol = Math.round(player.xPixel / BLOCK_SIZE);
        const currentR = Math.floor(player.yPixel / BLOCK_SIZE);
        const nextR = currentR + 1;

        if (nextR < ROWS && grid[nextR] && grid[nextR][checkCol] === null) {
            player.yPixel += 6;
            if (player.yPixel > (ROWS - 1) * BLOCK_SIZE) {
                player.yPixel = (ROWS - 1) * BLOCK_SIZE;
            }
        } else {
            player.yPixel = currentR * BLOCK_SIZE;
        }
    }

    for (let i = fallingCrates.length - 1; i >= 0; i--) {
        const crate = fallingCrates[i];
        crate.yPixel += crate.speed;
        const crateBottomRow = Math.floor((crate.yPixel + BLOCK_SIZE - 2) / BLOCK_SIZE);

        const playerCol = Math.round(player.xPixel / BLOCK_SIZE);
        const playerR = Math.round(player.yPixel / BLOCK_SIZE);

        if (crateBottomRow >= ROWS || (grid[crateBottomRow] && grid[crateBottomRow][crate.col] !== null)) {
            const finalR = crateBottomRow - 1;

            if (finalR === playerR && crate.col === playerCol && player.invincibleTimer === 0) {
                lives--;
                updateLivesDisplay();
                sound.hit();

                burnEffects.push({ row: playerR, timer: 4 });

                if (lives <= 0) {
                    player.alive = false;
                    gameOver = true;
                    statusTextEl.innerText = "OVER";
                    playLedEl.classList.remove('led-active');
                    sound.stopMusic();
                } else {
                    fallingCrates.splice(i, 1);
                    player.invincibleTimer = 15;
                }
            } else if (finalR >= 0) {
                if (crate.type === 5) {
                    triggerTNTExplosion(finalR, crate.col);
                } else {
                    grid[finalR][crate.col] = {
                        type: crate.type,
                        xPixel: crate.xPixel,
                        yPixel: crate.yPixel
                    };
                }
                fallingCrates.splice(i, 1);

                checkLines();
                applyPhysicsToGrid();
            }
        }
    }

    burnEffects.forEach((eff, i) => {
        eff.timer--;
        if (eff.timer <= 0) burnEffects.splice(i, 1);
    });
}

function drawCrane() {
    ctx.fillStyle = '#666';
    ctx.fillRect(0, 0, crane.xPixel + BLOCK_SIZE, 12);
    ctx.fillRect(crane.xPixel + 20, 12, 10, 20);
}

function drawFlatSquareShadow(crate, colors) {
    const col = crate.targetCol;
    let landingRow = ROWS - 1;

    for (let r = 0; r < ROWS; r++) {
        if (grid[r][col] !== null) {
            landingRow = r - 1;
            break;
        }
    }

    if (landingRow < 0) return;

    const targetY = (landingRow + 1) * BLOCK_SIZE; 
    const currentY = crate.yPixel + BLOCK_SIZE;

    const totalDistance = targetY - 40; 
    const remainingDistance = Math.max(0, targetY - currentY);
    const progress = 1 - Math.min(1, remainingDistance / totalDistance);

    const shadowWidth = (BLOCK_SIZE - 10) * (0.4 + 0.6 * progress);
    const shadowHeight = 8; 
    const alpha = 0.25 + 0.6 * progress;

    const shadowX = crate.xPixel + (BLOCK_SIZE - shadowWidth) / 2;
    const shadowY = targetY - shadowHeight - 2;

    ctx.save();
    ctx.fillStyle = crate.type === 5 
        ? `rgba(255, 51, 51, ${alpha})` 
        : (currentTheme === 'amber' ? `rgba(255, 176, 0, ${alpha})` : `rgba(0, 255, 65, ${alpha})`);
        
    ctx.fillRect(shadowX, shadowY, shadowWidth, shadowHeight);
    ctx.restore();
}

function drawCrate(x, y, type, colors) {
    if (type === 5) {
        ctx.fillStyle = colors.red;
        ctx.fillRect(x + 1, y + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
        ctx.fillStyle = colors.bg;
        ctx.fillRect(x + 5, y + 5, BLOCK_SIZE - 10, BLOCK_SIZE - 10);
        ctx.fillStyle = colors.red;
        ctx.fillRect(x + 8, y + 18, BLOCK_SIZE - 16, 14);
        ctx.fillStyle = colors.bright;
        ctx.font = 'bold 10px "Courier New"';
        ctx.fillText("TNT", x + 13, y + 29);
        ctx.strokeStyle = colors.bright;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 25, y + 5);
        ctx.lineTo(x + 25, y + 1);
        ctx.stroke();
        return;
    }

    ctx.fillStyle = colors.on;
    ctx.fillRect(x + 1, y + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
    ctx.fillStyle = colors.bg;
    ctx.fillRect(x + 4, y + 4, BLOCK_SIZE - 8, BLOCK_SIZE - 8);
    ctx.fillStyle = colors.on;

    if (type === 1) {
        for (let i = 8; i < BLOCK_SIZE - 8; i += 5) {
            ctx.fillRect(x + i, y + i, 4, 4);
            ctx.fillRect(x + BLOCK_SIZE - i - 4, y + i, 4, 4);
        }
    } else if (type === 2) {
        ctx.fillRect(x + 8, y + 8, 5, 5);
        ctx.fillRect(x + BLOCK_SIZE - 13, y + 8, 5, 5);
        ctx.fillRect(x + 8, y + BLOCK_SIZE - 13, 5, 5);
        ctx.fillRect(x + BLOCK_SIZE - 13, y + BLOCK_SIZE - 13, 5, 5);
        ctx.fillRect(x + 12, y + 22, BLOCK_SIZE - 24, 5);
    } else if (type === 3) {
        ctx.fillStyle = colors.bright;
        ctx.fillRect(x + 10, y + 10, 15, 4);
        ctx.fillRect(x + 10, y + 10, 4, 15);
        ctx.fillRect(x + 25, y + 25, 12, 4);
    } else if (type === 4) {
        ctx.fillStyle = colors.bright;
        ctx.fillRect(x + 21, y + 10, 8, 30);
        ctx.fillRect(x + 10, y + 21, 30, 8);
    }
}

function drawPlayer(x, y, colors) {
    if (player.invincibleTimer % 2 === 1) return;

    ctx.fillStyle = colors.on;
    ctx.fillRect(x + 13, y - 2, 24, 6);
    
    ctx.fillStyle = colors.bright;
    if (player.facing === 1) {
        ctx.fillRect(x + 25, y + 2, 14, 4);
    } else {
        ctx.fillRect(x + 11, y + 2, 14, 4);
    }

    ctx.fillStyle = colors.bright;
    ctx.fillRect(x + 15, y + 4, 20, 11);
    
    ctx.fillStyle = colors.bg;
    const eyeX = player.facing === 1 ? x + 28 : x + 18;
    ctx.fillRect(eyeX, y + 6, 5, 5);

    ctx.fillStyle = colors.on;
    ctx.fillRect(x + 12, y + 15, 26, 20);

    if (player.isJumping) {
        ctx.fillStyle = colors.on;
        ctx.fillRect(x + 2, y + 5, 10, 5);
        ctx.fillRect(x + 6, y + 10, 6, 6);
        ctx.fillRect(x + 38, y + 5, 10, 5);
        ctx.fillRect(x + 38, y + 10, 6, 6);
    } else {
        ctx.fillRect(x + 2, y + 20, 10, 5);
        ctx.fillRect(x + 38, y + 20, 10, 5);
    }

    ctx.fillStyle = colors.dim;
    let legOffset = 0;
    if (player.isMoving) {
        legOffset = Math.sin(player.walkFrame) * 4;
    }

    ctx.fillRect(x + 12 + legOffset, y + 35, 10, 13);
    ctx.fillRect(x + 28 - legOffset, y + 35, 10, 13);
}

function drawMenuButton(btn, text, subtext, colors) {
    ctx.fillStyle = colors.on;
    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);

    ctx.fillStyle = colors.bg;
    ctx.font = 'bold 18px "Courier New"';
    ctx.fillText(text, btn.x + 15, btn.y + 28);

    ctx.font = 'bold 12px "Courier New"';
    ctx.fillText(subtext, btn.x + 180, btn.y + 28);
}

function draw() {
    const colors = getThemeColors();

    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (!gameStarted) {
        ctx.fillStyle = colors.bg;
        ctx.fillRect(80, 150, 540, 420);
        ctx.strokeStyle = colors.on;
        ctx.lineWidth = 4;
        ctx.strokeRect(80, 150, 540, 420);

        ctx.fillStyle = colors.on;
        ctx.font = '32px "Courier New"';
        ctx.fillText("STACK ATTACK", 240, 220);

        ctx.font = '16px "Courier New"';
        ctx.fillText("SELECT DIFFICULTY:", 250, 270);

        drawMenuButton(easyBtn, "[1] EASY", "+10%/lvl", colors);
        drawMenuButton(medBtn,  "[2] MEDIUM", "+15%/lvl", colors);
        drawMenuButton(hardBtn, "[3] HARD", "+20%/lvl", colors);

        ctx.fillStyle = colors.bright;
        ctx.font = '12px "Courier New"';
        ctx.fillText("MAX SPEED LIMIT: +80%", 260, 530);
        return;
    }

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const block = grid[r][c];
            if (block !== null) {
                drawCrate(block.xPixel, block.yPixel, block.type, colors);
            }
        }
    }

    fallingCrates.forEach(crate => { drawFlatSquareShadow(crate, colors); });

    burnEffects.forEach(eff => {
        ctx.fillStyle = colors.bright;
        ctx.fillRect(0, eff.row * BLOCK_SIZE, canvas.width, BLOCK_SIZE);
    });

    fallingCrates.forEach(crate => { drawCrate(crate.xPixel, crate.yPixel, crate.type, colors); });
    drawCrane();

    if (player.alive) { drawPlayer(player.xPixel, player.yPixel, colors); }

    if (isPaused && !gameOver) {
        ctx.fillStyle = colors.bg;
        ctx.fillRect(200, 300, 300, 100);
        ctx.strokeStyle = colors.on;
        ctx.lineWidth = 4;
        ctx.strokeRect(200, 300, 300, 100);

        ctx.fillStyle = colors.on;
        ctx.font = '26px "Courier New"';
        ctx.fillText("|| PAUSE", 280, 358);
    }

    if (gameOver) {
        ctx.fillStyle = colors.bg;
        ctx.fillRect(150, 250, 400, 200);
        ctx.strokeStyle = colors.on;
        ctx.lineWidth = 4;
        ctx.strokeRect(150, 250, 400, 200);

        ctx.fillStyle = colors.on;
        ctx.font = '28px "Courier New"';
        ctx.fillText("GAME OVER", 280, 310);

        ctx.fillStyle = colors.on;
        ctx.fillRect(restartBtn.x, restartBtn.y, restartBtn.w, restartBtn.h);

        ctx.fillStyle = colors.bg;
        ctx.font = 'bold 20px "Courier New"';
        ctx.fillText("NEW GAME", restartBtn.x + 50, restartBtn.y + 32);
    }
}

function gameLoop() {
    update();
    draw();
    setTimeout(() => requestAnimationFrame(gameLoop), 1000 / 30);
}

updateLivesDisplay();
gameLoop();
</script>
